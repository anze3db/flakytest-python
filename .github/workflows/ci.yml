name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        pytest: ["6", "7", "8", "9"]
        exclude:
          # pytest 6 uses ast.Str, which Python 3.14 removed
          - python: "3.14"
            pytest: "6"
          - python: "3.15"
            pytest: "6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        env:
          PY: ${{ matrix.python }}
          PYTEST: ${{ matrix.pytest }}
          # The plugin reports this run to flakytest.dev, which mutes tests/test_flake.py's failures
          FLAKYTEST_SECRET_TOKEN: ${{ secrets.FLAKYTEST_SECRET_TOKEN }}
        # pytest-xdist and Django run the synthetic suites in tests/test_accuracy.py (both need pytest 7+)
        run: |
          extra=()
          if [ "$PYTEST" != 6 ]; then extra=(--with pytest-xdist --with django); fi
          uv run --python "$PY" --with "pytest~=$PYTEST.0" "${extra[@]}" pytest -q

  # flakytest's overhead budget on a generated 5,000-test suite: building the profile after the last test takes at
  # most 10% of the run, and exact mode (no sampling) slows it down by at most 5%
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
      - run: uv run --python 3.15 --with pytest-xdist scripts/benchmark.py --workers 2
