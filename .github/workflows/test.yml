name: Test

on:
  push:
    branches:
    - main
  pull_request:

permissions:
  contents: read

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        pytest-version: ["~=6.0", "~=7.0"] # Test with Python 6.x and 7.x
        exclude: # pytest 6.x doesn't support Python 3.14+
        - python-version: "3.14"
          pytest-version: "~=6.0"
        - python-version: "3.15"
          pytest-version: "~=6.0"

    environment: release
    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }} & Pytest ${{ matrix.pytest-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: 'pip'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install hatch
    - name: Build package
      run: hatch build
    - name: Install pytest${{ matrix.pytest-version }}
      run: hatch run pip install 'pytest${{ matrix.pytest-version }}'
    - name: Test package
      run: hatch run test
      env:
        FLAKYTEST_SECRET_TOKEN: ${{ secrets.FLAKYTEST_SECRET_TOKEN }}
