[project]
name = "flakytest"
# CalVer: YYYY.0bN = the Nth beta of YYYY (2026.0b0, 2026.0b1, ...). Bumped by scripts/release.py.
version = "2026.0b0"
description = 'Pytest plugin for flakytest.dev'
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = [
  "test",
  "flaky",
  "pytest"
]
authors = [
  { name = "Anže Pečar", email = "anze@pecar.me" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Framework :: Pytest",
]
dependencies = [
  "pytest>=6",
  "python-dotenv",
  "urllib3",
]

[project.urls]
Documentation = "https://github.com/anze3db/flakytest-python#readme"
Changelog = "https://github.com/anze3db/flakytest-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/anze3db/flakytest-python/issues"
Source = "https://github.com/anze3db/flakytest-python"
Mastodon = "https://fosstodon.org/@anze3db"
Twitter = "https://twitter.com/anze3db"

[project.entry-points.pytest11]
flakytest = "flakytest.hook"


[dependency-groups]
dev = [
  "mypy>=1.0",
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
files = ["src/flakytest", "tests", "scripts"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105", "S106", "S107",
  # Ignore complexity
  "C901", "PLR2004", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
  # Ignore assert False
  "B011",
  "S311",
  "T201", # Print statements, remove once you figure out how to use logging
  "S607", "S603", "E722"
]
unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.lint.isort]
known-first-party = ["flakytest"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, relative imports, and fixtures or fakes they don't read
"tests/**/*" = ["ARG", "PLR2004", "S101", "TID252"]
# The release script: command handlers take args they don't all read, dates are local
"scripts/**/*" = ["ARG001", "DTZ011", "EM101", "EM102", "FBT001", "FBT002", "PLR0917", "PLW2901"]
